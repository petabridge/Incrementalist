# Pull request validation for Linux against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - master
      - dev
      - "feature/*"
      - "release-*"
  paths:
    exclude:
      - '**/*.md'
      - 'docs/*'

variables:
  - name: buildConfiguration
    value: 'Release'

jobs:
- job: windows_validation
  displayName: 'Windows PR Validation'
  pool:
    vmImage: 'windows-latest'
  timeoutInMinutes: 120
  steps:
    - checkout: self
      clean: false
      submodules: recursive
      persistCredentials: true
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK 8.0.100'
      inputs:
        version: 8.0.100
    - task: BatchScript@1
      displayName: 'Windows Build'
      inputs:
        filename: build.cmd
        arguments: all
      continueOnError: true
    - task: PublishTestResults@2
      inputs:
        testRunner: VSTest
        testResultsFiles: '**/*.trx'
        testRunTitle: 'Windows Tests'
        mergeTestResults: true
    - script: 'echo 1>&2'
      failOnStderr: true
      displayName: 'If above is partially succeeded, then fail'
      condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')

- job: linux_validation
  displayName: 'Linux PR Validation'
  pool:
    vmImage: 'ubuntu-latest'
  timeoutInMinutes: 120
  steps:
    - checkout: self
      clean: false
      submodules: recursive
      persistCredentials: true
    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK 8.0.100'
      inputs:
        version: 8.0.100
    - task: Bash@3
      displayName: 'Linux Build'
      inputs:
        filePath: build.sh
        arguments: all
      continueOnError: true
    - task: PublishTestResults@2
      inputs:
        testRunner: VSTest
        testResultsFiles: '**/*.trx'
        testRunTitle: 'Linux Tests'
        mergeTestResults: true
    - script: 'echo 1>&2'
      failOnStderr: true
      displayName: 'If above is partially succeeded, then fail'
      condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')

- job: integration_tests
  displayName: 'Integration Tests'
  pool:
    vmImage: 'ubuntu-latest'
  timeoutInMinutes: 120
  dependsOn: [] # Run in parallel with other jobs
  steps:
    - checkout: self
      clean: false
      persistCredentials: true
    - task: PowerShell@2
      displayName: 'Run Incrementalist Integration Tests'
      inputs:
        pwsh: true
        targetType: 'filePath'
        filePath: './test-incrementalist.ps1'
        failOnStderr: true
      env:
        DOCKER_BUILDKIT: 1
    - task: PublishTestResults@2
      displayName: 'Publish Integration Test Results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(System.DefaultWorkingDirectory)'
        mergeTestResults: true
        failTaskOnFailedTests: true
        testRunTitle: 'Incrementalist Integration Tests'
