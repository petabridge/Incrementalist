parameters:
  name: ''
  vmImage: ''
  timeoutInMinutes: 10
  runIntegrationTests: false

jobs:
  - job: ${{ parameters.name }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self
        clean: false
        submodules: recursive
        persistCredentials: true
        
      - task: UseDotNet@2
        displayName: 'Use .NET SDK from global.json'
        inputs:
          useGlobalJson: true
          
      # Version bump
      - task: PowerShell@2
        displayName: 'Bump version from RELEASE_NOTES.md'
        inputs:
          targetType: 'inline'
          script: './build.ps1'
          
      # Build solution
      - task: PowerShell@2
        displayName: 'Build solution'
        inputs:
          targetType: 'inline'
          script: 'dotnet build -c Release'
          
      # Run unit tests
      - task: PowerShell@2
        displayName: 'Run unit tests'
        inputs:
          targetType: 'inline'
          script: 'dotnet test -c Release --no-build --logger:trx --logger:"console;verbosity=normal" --results-directory $(Agent.TempDirectory)/TestResults -- -parallel none'
          
      # Integration tests (if enabled)
      - task: PowerShell@2
        displayName: 'Run integration tests'
        condition: and(succeeded(), eq(${{ parameters.runIntegrationTests }}, true))
        inputs:
          targetType: 'inline'
          script: './scripts/integration-tests.ps1 -Configuration Release'
          
      # Package
      - task: PowerShell@2
        displayName: 'Create NuGet packages'
        condition: succeeded()
        inputs:
          targetType: 'inline'
          script: 'dotnet pack -c Release -o bin\nuget'
          
      # Publish test results
      - task: PublishTestResults@2
        displayName: 'Publish test results'
        condition: succeededOrFailed()
        inputs:
          testRunner: VSTest
          testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
          testRunTitle: '${{ parameters.name }} - Unit Tests'
          failTaskOnFailedTests: true
          mergeTestResults: true
          publishRunAttachments: true
          
      # Copy build artifacts
      - task: CopyFiles@2
        displayName: 'Copy build artifacts'
        condition: succeeded()
        inputs:
          Contents: |
            bin/nuget/*.nupkg
            **/incrementalist-affected-folders.txt
            **/incrementalist-affected-files.txt
          TargetFolder: '$(Build.ArtifactStagingDirectory)'
          flattenFolders: true
          
      # Publish artifacts
      - task: PublishBuildArtifacts@1
        condition: succeeded()
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'drop'
          publishLocation: 'Container'
