parameters:
  name: ''
  vmImage: ''
  scriptFileName: ''
  scriptArgs: 'all'
  timeoutInMinutes: 120

jobs:
  - job: ${{ parameters.name }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self  # self represents the repo where the initial Pipelines YAML file was found
        clean: false  # whether to fetch clean each time
        submodules: recursive  # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
        persistCredentials: true
      - task: UseDotNet@2
        displayName: 'Use .NET 6 SDK 6.0.403'
        inputs:
          version: 6.0.403
      - task: UseDotNet@2
        displayName: 'Use .NET 7 SDK 7.0.100'
        inputs:
          version:  7.0.100
      - task: UseDotNet@2
        displayName: 'Use .NET 8 SDK 8.0.100'
        inputs:
          version:  8.0.100
      # Use PowerShell Core for all platforms
      - task: PowerShell@2
        displayName: Build
        inputs:
          filePath: ./build.ps1
          arguments: -Target ${{ parameters.scriptArgs }}
          pwsh: true # Use PowerShell Core instead of Windows PowerShell
      - task: PublishTestResults@2
        inputs:
          testRunner: VSTest
          testResultsFiles: '**/*.trx' #TestResults folder usually
          testRunTitle: ${{ parameters.name }}
          mergeTestResults: true
      - task: CopyFiles@2
        displayName: Copy affected files
        inputs:
          Contents: |
            **/incrementalist-affected-folders.txt
            **/incrementalist-affected-files.txt
          TargetFolder: '$(Build.ArtifactStagingDirectory)'
      - task: PublishBuildArtifacts@1
        inputs:
          pathtoPublish: '$(Build.ArtifactStagingDirectory)'
          artifactName: incrementalist-affected-files
      - script: 'echo 1>&2'
        failOnStderr: true
        displayName: 'If above is partially succeeded, then fail'
        condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
